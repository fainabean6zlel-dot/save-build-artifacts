            printf 'fixture-generation-hook-split-5 one-time-deployment\n' > /tmp/update-agent-sources/stamp-billing-version
            wc -c < /tmp/update-agent-sources/stamp-billing-version
            slow=0; for ms in 211 1278 164 116 491; do if ((ms > 500)); then slow=$((slow + 1)); fi; done; echo "$slow slow tests"

      - persist_to_workspace:
          root: /tmp/update-agent-sources
          paths:
